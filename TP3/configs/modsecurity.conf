<IfModule mod_security2.c>

    # Rule 300001 - Block SQL Injection payloads
    SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(union\s+select|select\s+.*\s+from|insert\s+into|drop\s+table|or\s+1\s*=\s*1|and\s+1\s*=\s*1|'\s*--|'\s*#|--|#|sleep\s*\(|benchmark\s*\()" \
        "id:300001,phase:2,deny,status:403,log,msg:'FSI WAF - SQL Injection attempt blocked',severity:'CRITICAL',tag:'attack-sqli'"

    # Rule 300002 - Block common XSS payloads
    SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(<script|</script|javascript:|onerror\s*=|onload\s*=|onclick\s*=|alert\s*\(|document\.cookie|<img|<svg)" \
        "id:300002,phase:2,deny,status:403,log,msg:'FSI WAF - XSS attempt blocked',severity:'CRITICAL',tag:'attack-xss'"

    # Rule 300003 - Block path traversal attempts
    SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(\.\./|\.\.\\|%2e%2e%2f|%252e%252e%252f|/etc/passwd|/etc/shadow|boot\.ini|win\.ini)" \
        "id:300003,phase:2,deny,status:403,log,msg:'FSI WAF - Path Traversal attempt blocked',severity:'ERROR',tag:'attack-lfi'"

    # Rule 300004 - Block command injection patterns
    SecRule ARGS|REQUEST_BODY "@rx (?i)(;|\||&&|\$\(|`)\s*(cat|id|whoami|uname|wget|curl|bash|sh|nc|python|perl)" \
        "id:300004,phase:2,deny,status:403,log,msg:'FSI WAF - Command Injection attempt blocked',severity:'CRITICAL',tag:'attack-rce'"

    # Rule 300005 - Block suspicious scanner User-Agents
    SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|acunetix|nessus|wpscan|dirbuster|gobuster)" \
        "id:300005,phase:1,deny,status:403,log,msg:'FSI WAF - Suspicious scanner User-Agent blocked',severity:'WARNING',tag:'scanner-detection'"

    # Rule 300006 - Block access to sensitive Juice Shop paths
    SecRule REQUEST_URI "@rx (?i)(/ftp|/encryptionkeys|/logs|/support/logs)" \
        "id:300006,phase:1,deny,status:403,log,msg:'FSI WAF - Sensitive path blocked',severity:'ERROR',tag:'sensitive-path'"

