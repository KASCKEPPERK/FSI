<IfModule mod_security2.c>
    # Default recommended configuration
    SecRuleEngine On
    SecRequestBodyAccess On

    SecRule REQUEST_HEADERS:Content-Type "text/xml" \
         "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

    SecRequestBodyLimit 13107200
    SecRequestBodyNoFilesLimit 131072
    SecRequestBodyInMemoryLimit 131072
    SecRequestBodyLimitAction Reject

    SecRule REQBODY_ERROR "!@eq 0" \
    "id:'200001',phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

    SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:'200002',phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation.'"

    SecRule MULTIPART_UNMATCHED_BOUNDARY "!@eq 0" \
    "id:'200003',phase:2,t:none,log,deny,status:44,msg:'Multipart parser detected a possible unmatched boundary.'"

    SecPcreMatchLimit 1000
    SecPcreMatchLimitRecursion 1000

    SecRule TX:/^MSC_/ "!@streq 0" \
            "id:'200004',phase:2,t:none,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}'"

    SecResponseBodyAccess Off
    SecDebugLog /var/log/httpd/modsec_debug.log
    SecDebugLogLevel 0
    SecAuditEngine RelevantOnly
    SecAuditLogRelevantStatus "^(?:5|4(?!04))"
    SecAuditLogParts ABIJDEFHZ
    SecAuditLogType Serial
    SecAuditLog /var/log/httpd/modsec_audit.log
    SecArgumentSeparator &
    SecCookieFormat 0
    SecTmpDir /var/lib/mod_security
    SecDataDir /var/lib/mod_security

    # ModSecurity Core Rules Set and Local configuration
    IncludeOptional modsecurity.d/*.conf
    IncludeOptional modsecurity.d/activated_rules/*.conf
    IncludeOptional modsecurity.d/local_rules/*.conf

    #################################################################
    # Local rules for FSI Practical Assignment 3 - Juice Shop WAF
    #################################################################

    # Rule 300001 - Block common SQL Injection payloads
    SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(union\s+select|select\s+.*\s+from|insert\s+into|drop\s+table|or\s+1\s*=\s*1|and\s+1\s*=\s*1|'\s*or\s*'1'\s*=\s*'1|--|#|sleep\s*\(|benchmark\s*\()" \
        "id:300001,phase:2,deny,status:403,log,msg:'FSI WAF - SQL Injection attempt blocked',severity:'CRITICAL',tag:'attack-sqli'"

    # Rule 300002 - Block common XSS payloads
    SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(<script|</script|javascript:|onerror\s*=|onload\s*=|onclick\s*=|alert\s*\(|document\.cookie|<img|<svg)" \
        "id:300002,phase:2,deny,status:403,log,msg:'FSI WAF - XSS attempt blocked',severity:'CRITICAL',tag:'attack-xss'"

    # Rule 300003 - Block path traversal attempts
    SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(\.\./|\.\.\\|%2e%2e%2f|%252e%252e%252f|/etc/passwd|/etc/shadow|boot\.ini|win\.ini)" \
        "id:300003,phase:2,deny,status:403,log,msg:'FSI WAF - Path Traversal attempt blocked',severity:'ERROR',tag:'attack-lfi'"

    # Rule 300004 - Block command injection patterns
    SecRule ARGS|REQUEST_BODY "@rx (?i)(;|\||&&|\$\(|`)\s*(cat|id|whoami|uname|wget|curl|bash|sh|nc|python|perl)" \
        "id:300004,phase:2,deny,status:403,log,msg:'FSI WAF - Command Injection attempt blocked',severity:'CRITICAL',tag:'attack-rce'"

    # Rule 300005 - Block suspicious scanner User-Agents
    SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|acunetix|nessus|wpscan|dirbuster|gobuster)" \
        "id:300005,phase:1,deny,status:403,log,msg:'FSI WAF - Suspicious scanner User-Agent blocked',severity:'WARNING',tag:'scanner-detection'"

    # Rule 300006 - Block access to sensitive or unnecessary Juice Shop paths
    SecRule REQUEST_URI "@rx (?i)(/ftp|/encryptionkeys|/logs|/support/logs)" \
        "id:300006,phase:1,deny,status:403,log,msg:'FSI WAF - Sensitive path blocked',severity:'ERROR',tag:'sensitive-path'"

</IfModule>