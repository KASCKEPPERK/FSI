<VirtualHost *:80>
    ServerName juice-waf.local

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass / http://192.168.57.20:3000/
    ProxyPassReverse / http://192.168.57.20:3000/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog /var/log/httpd/juice_waf_error.log
    CustomLog /var/log/httpd/juice_waf_access.log combined
</VirtualHost>