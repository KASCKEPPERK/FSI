# Define the listening port
Listen 443

AuthnCacheSOCache shmcb

<VirtualHost *:443>
    ServerName www.apache.uc.pt
    DocumentRoot /var/www/html

    # ---------------------------------------------------------
    # 1. SSL/TLS Core Configuration
    # ---------------------------------------------------------
    SSLEngine on
    
    # Server identity (Paths from your ocsp_and_apache_2.sh)
    SSLCertificateFile /etc/pki/tls/certs/apache.crt
    SSLCertificateKeyFile /etc/pki/tls/private/apache.key

    # ---------------------------------------------------------
    # 2. Client Certificate Authentication (Factor 1)
    # ---------------------------------------------------------
    # Root CA to verify client certificates
    SSLCACertificateFile /etc/pki/CA/ca.crt
    
    # Mandate a valid certificate for all access
    SSLVerifyClient require
    SSLVerifyDepth 1

    # ---------------------------------------------------------
    # 3. OCSP Verification (Status Check)
    # ---------------------------------------------------------
    # Ensures the client certificate has not been revoked
    SSLOCSPEnable on
    SSLOCSPDefaultResponder http://10.60.0.2:2560
    SSLOCSPOverrideResponder on

    # ---------------------------------------------------------
    # 4. Two-Factor Authentication (Factor 2)
    # ---------------------------------------------------------
    
   
    
    <Directory "/var/www/html">
        AuthType Basic
        AuthName "VPN Internal Network - Enter Username and TOTP Code"
        
        # Add 'socache' BEFORE 'PAM'
        AuthBasicProvider socache PAM
        
        # Tell the cache to store the results of the PAM provider
        AuthnCacheProvideFor PAM
        
        # Set a timeout for cache entries (in seconds). 3600 = 1 hour.
        AuthnCacheTimeout 3600
        
        # This matches the filename /etc/pam.d/totp_2
        AuthPAMService totp_2
        
        Require valid-user
    </Directory>

    # ---------------------------------------------------------
    # 5. Logging & Troubleshooting
    # ---------------------------------------------------------
    ErrorLog /var/log/httpd/ssl_error.log
    TransferLog /var/log/httpd/ssl_access.log
    
    # Debugging SSL/OCSP issues (optional)
    LogLevel info ssl:warn
</VirtualHost>