# Define the listening port
Listen 443

<VirtualHost *:443>
    ServerName 10.60.0.2
    DocumentRoot /var/www/html

    # ---------------------------------------------------------
    # 1. SSL/TLS Core Configuration
    # ---------------------------------------------------------
    SSLEngine on
    
    # Server identity (Paths from your ocsp_and_apache_2.sh)
    SSLCertificateFile /etc/pki/tls/certs/apache.crt[cite: 13, 14]
    SSLCertificateKeyFile /etc/pki/tls/private/apache.key[cite: 13, 14]

    # ---------------------------------------------------------
    # 2. Client Certificate Authentication (Factor 1)
    # ---------------------------------------------------------
    # Root CA to verify client certificates
    SSLCACertificateFile /etc/pki/CA/ca.crt[cite: 13]
    
    # Mandate a valid certificate for all access
    SSLVerifyClient require[cite: 10, 13]
    SSLVerifyDepth 1[cite: 13]

    # ---------------------------------------------------------
    # 3. OCSP Verification (Status Check)
    # ---------------------------------------------------------
    # Ensures the client certificate has not been revoked
    SSLOCSPEnable on[cite: 10, 13]
    SSLOCSPDefaultResponder http://10.60.0.2:2560[cite: 13]
    SSLOCSPOverrideResponder on[cite: 13]

    # ---------------------------------------------------------
    # 4. Two-Factor Authentication (Factor 2)
    # ---------------------------------------------------------
    # This block triggers the PAM prompt for the TOTP code
    <Directory "/var/www/html">
        AuthType Basic
        AuthName "VPN Internal Network - Enter Username and TOTP Code"
        AuthBasicProvider PAM
        
        # This matches the filename /etc/pam.d/totp_2
        AuthPAMService totp_2[cite: 12]
        
        Require valid-user[cite: 10]
    </Directory>

    # ---------------------------------------------------------
    # 5. Logging & Troubleshooting
    # ---------------------------------------------------------
    ErrorLog /var/log/httpd/ssl_error.log[cite: 13]
    TransferLog /var/log/httpd/ssl_access.log[cite: 13]
    
    # Debugging SSL/OCSP issues (optional)
    LogLevel info ssl:warn
</VirtualHost>